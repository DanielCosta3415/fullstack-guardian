name: CodeQL security analysis

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Python CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3, pinned
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3, pinned
        with:
          category: "/language:python"
