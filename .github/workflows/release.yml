name: Prepare release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python tools/guardian.py validate
      - run: python tools/guardian.py eval
      - run: python tools/build_release.py
      # Trusted provenance is created by GitHub Actions OIDC, never by a repository secret.
      # Signing requires GitHub attestation support for this repository.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3 pinned
        with:
          subject-path: dist/fullstack-guardian-*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guardian-release
          path: dist/*
          if-no-files-found: error
